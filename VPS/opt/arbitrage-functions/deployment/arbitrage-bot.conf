[program:arbitrage-bot]
; Arbitrage Bot Trading Service Configuration

; Program command
command=/usr/bin/deno run \
  --allow-net \
  --allow-env \
  --allow-write \
  --allow-read \
  /opt/arbitrage-functions/supabase/functions/server.ts

; Working directory
directory=/opt/arbitrage-functions

; User to run as
user=arbitrage

; Restart behavior
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
startretries=3

; Output logging
stdout_logfile=/var/log/arbitrage-bot/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/arbitrage-bot/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Environment
environment=NODE_ENV=production

; Process management
priority=999
umask=0022
