services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
    networks:
      - arbitrage-network

  functions:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arbitrage-functions
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://repo-reveal.lovable.app}
      - FUNCTIONS_API_KEY=${FUNCTIONS_API_KEY}
      - RUNTIME=vps
      - TRADING_ENABLED=${TRADING_ENABLED:-false}
      - EXECUTION_MODE=${EXECUTION_MODE:-disabled}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SCAN_INTERVAL_SECONDS=${SCAN_INTERVAL_SECONDS:-30}
    env_file:
      - .env
    networks:
      - arbitrage-network
    healthcheck:
      test: ["CMD", "deno", "eval", "fetch('http://localhost:8000/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  dockhand_data:

networks:
  arbitrage-network:
    driver: bridge
